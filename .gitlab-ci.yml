default:
  image: node:20
  tags:
    - docker

stages:
  - verify
  - build
  - deploy

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

.node:
  before_script:
    - npm ci

lint:
  extends: .node
  stage: verify
  script:
    - npm run lint

test:
  extends: .node
  stage: verify
  script:
    - npm test

build:
  extends: .node
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - main.js
      - manifest.json
      - styles.css
    expire_in: 1 week

mirror_to_github:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@gitlab.local"
    - git config --global user.name "GitLab CI"
  script:
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://oauth2:${GITHUB_TOKEN}@github.com/e1fueg0/kitchen-forge.git"
    - git push github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}" --force
    - git push github "HEAD:main" --force